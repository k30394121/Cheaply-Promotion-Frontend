<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructions - Token Tycoon</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-900 via-purple-800 to-pink-900 min-h-screen">
    
    <!-- Header -->
    <header class="bg-purple-900/50 backdrop-blur-sm border-b border-purple-600/50 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center gap-4">
                <button onclick="history.back()" class="text-white hover:text-purple-200 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                </button>
                <svg class="w-6 h-6 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
                <h1 class="text-2xl font-bold text-white">Instructions & About</h1>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 max-w-4xl">
        
        <!-- Hero Section -->
        <div class="bg-gradient-to-br from-purple-800/50 to-purple-900/50 backdrop-blur-sm rounded-2xl p-8 border-4 border-purple-500 shadow-2xl shadow-purple-500/30 mb-8 text-center">
            <svg class="w-16 h-16 text-yellow-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <h2 class="text-4xl font-bold text-white mb-3">How to Play Token Tycoon</h2>
            <p class="text-purple-200 text-lg">
                Everything you need to know to become a master player
            </p>
        </div>

        <!-- Accordion Sections -->
        <div class="space-y-4" id="sections">
            <!-- Sections will be inserted here -->
        </div>

        <!-- Quick Start CTA -->
        <div class="mt-8 bg-gradient-to-r from-yellow-600 to-orange-600 rounded-2xl p-8 text-center shadow-2xl">
            <h3 class="text-2xl font-bold text-white mb-4">Ready to Play?</h3>
            <p class="text-yellow-100 mb-6">
                Start your journey to becoming a Token Tycoon today!
            </p>
            <div class="flex gap-4 justify-center flex-wrap">
                <button onclick="window.location.href='signup.html'" 
                        class="px-8 py-3 bg-white text-orange-600 font-bold rounded-full hover:bg-purple-100 transition-colors shadow-lg">
                    Connect Wallet & Start
                </button>
                <button onclick="window.location.href='wheel.html'" 
                        class="px-8 py-3 bg-purple-900/50 text-white font-bold rounded-full hover:bg-purple-900/70 transition-colors border-2 border-white/30">
                    Play as Guest
                </button>
            </div>
        </div>
    </main>

 <script>
        const sections = [
            {
                id: 'welcome',
                icon: '📖',
                title: 'Welcome to Token Tycoon',
                color: 'from-purple-600 to-purple-700',
                content: `Token Tycoon is a game designed to let you enjoy the journey of becoming a tycoon, step by step.

                As you play, collect Game Tokens to level up, climb the rankings, and unlock achievements.
                
                • **Web2 Gaming:** Earn "Game Tokens" (Web2 points) for rankings and achievements.

                • **Web3 Rewards:** Receive "Promotion Tokens" (Blockchain assets) as Bonus based on your purchases.
                
                Buy Game Tokens and get Web3 Rewards!`
            },
            {
                id: 'getting-started',
                icon: '🎯',
                title: 'Getting Started',
                color: 'from-blue-600 to-blue-700',
                content: `Start your journey with these rules:

                ** Lucky Spin:**
                   Uses **Spin Counts**.  Spin the wheel to win **Game Tokens**.

                ** Card Draw:**
                   Uses **Draw Counts**.  Draw to get **"Advanced Luck Cards"** for bonus effects.


                1. **New Account:** Get **5 Free Spins** and **3 Free Draws** instantly upon registration.

                2. ** Free Spin and Draw:**
                   • Get **1 Free Spin** and **1 Free Draw** every week.
                   • **Important:** Must be used within the current week and month. No rollovers to next week and month.

                3. **Referral Bonus:**
                  Share your unique referral code. 
                  When others register using your code, **YOU** receive **1 Free "Card Draw"** instantly.`
            },
            {
                id: 'buying',
                icon: '🛒',
                title: 'Buying & Airdrops (Value)',
                color: 'from-yellow-600 to-orange-600',
                content: `Purchase Game Tokens to upgrade your Level and get Web3 Airdrops.

                **💰 Price Rate:**
                • **1 Game Token = 0.000025 USDC** 
                • *(Example: 1 USDC = 40,000 Game Tokens)*

                **🎁 Web3 Airdrop Formula:**
                For every **1 Game Token** purchased, you get **0.0001 Promotion Token** (Web3).
                *(Max limit: 5,000 Promotion Tokens per user)* [cite: 20]`
            },
            {
                id: 'spinning',
                icon: '🎡',
                title: 'Wheel Rules',
                color: 'from-pink-600 to-red-600',
                content: `The wheel has 8 fixed slots (0-7). One spin costs 1 spin count.

                **Prize Slots:**
                • **GRAND (Slot 4):** **500,000,000 Tokens**. (Limited to 1 winner/month).
                • **MID (Slot 2, 6):** Medium reward based on Level.
                • **SMALL (Slot 0, 1):** Small reward based on Level.
                • **EMPTY (Slot 3, 5, 7):** No prize (Placed near Grand prize for excitement).
                
                
                Wheel Odds & Rules

                    Grand Prize (Slot 4): 500,000,000 Tokens. This is a unique reward limited to 1 winner per month. (Probability: 0 ~ 1 %)
                    Mid Tier (Slots 2, 6): Medium rewards based on your current level. (Probability: 10 ~ 11 %)
                    Small Tier (Slots 0, 1): Small rewards based on your current level. (Probability: 40 % )
                    No Prize (Slots 3, 5, 7): Better luck next time! (Probability: approx. 49 %)`
            },
            {
                id: 'leaderboard',
                icon: '🏆',
                title: 'Floating Price Lottery',
                color: 'from-yellow-600 to-yellow-700',
                content: ` A lottery ticket with a floating price

                The ticket price is fully determined by a special pricing model

                The pricing model depends on changes in the token pool and the passage of time

                A lottery draw is conducted every seven days

                All tokens in the prize pool are awarded to the winning ticket

                The maximum prize per draw is capped at 1 billion tokens

                After each draw, all lottery tickets are burned

                A new lottery round begins after the tickets are destroyed `
            },
            {
                id: 'cards',
                icon: '🃏',
                title: 'Achievement Cards',
                color: 'from-purple-600 to-pink-600',
                content: `Unlock cards for massive bonuses:

                **🏆 Basic Achievement Cards (Auto Unlock):**
                • **Supporter:** First purchase (Any amount) -> **Get 8,000 Tokens**.
                • **Collector:** Spin 7 times in a row -> **Get +20,000 Tokens** (on win).
                • **Token Tycoon:** Hold ≥ **101 Million Tokens** -> **Get +200 Million Tokens**.

                **⚡ Advanced Luck Cards (From Card Draw):**
                • **Lucky Star:** Double the prize money[cite: 50].
                • **Double Chance:** Get 2 token draws[cite: 50].
                • **Fortune Booster:** +10% Token holdings upon Level Up[cite: 50].`
            },
            {
                id: 'wallet',
                icon: '💳',
                title: 'Token Info',
                color: 'from-green-600 to-green-700',
                content: `Understanding the two token types:

                1. **Game Token (Web2):**
                   • Used for Levels (Lv1-Lv4) and Rankings.
                   • Cap: Holdings capped at 1 Billion.

                2. **Promotion Token (Web3):**
                   • Real blockchain asset.
                   • Distributed: 45 Million .(Total supply : 50M)
                   • Obtained via "Buying Game Tokens" bonus.`
            },
            {
                id: 'support',
                icon: 'ℹ️',
                title: 'System & Fairness',
                color: 'from-gray-600 to-gray-700',
                content: `• **Fixed Layout:** The wheel configuration is static to ensure consistency.
                • **Rich List:** Users with >1.01 Billion tokens are displayed on the Homepage Rich List.
                • **Version:** v1.0 (Internal Use Only).`
            }
        ];

        let expandedSection = null;

        function toggleSection(id) {
            expandedSection = expandedSection === id ? null : id;
            renderSections();
        }

        function renderSections() {
            const container = document.getElementById('sections');
            container.innerHTML = sections.map(section => `
                <div class="bg-gradient-to-br from-purple-800/30 to-purple-900/30 backdrop-blur-sm rounded-xl border-4 border-purple-500 shadow-lg shadow-purple-500/20 overflow-hidden transition-all duration-300">
                    <button onclick="toggleSection('${section.id}')" 
                            class="w-full flex items-center justify-between p-6 hover:bg-purple-700/20 transition-colors">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-lg bg-gradient-to-br ${section.color} flex items-center justify-center text-white text-2xl">
                                ${section.icon}
                            </div>
                            <h3 class="text-xl font-bold text-white text-left">${section.title}</h3>
                        </div>
                        <div class="text-purple-300">
                            <svg class="w-6 h-6 ${expandedSection === section.id ? 'rotate-180' : ''} transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>
                    </button>

                    ${expandedSection === section.id ? `
                        <div class="px-6 pb-6">
                            <div class="bg-purple-900/30 rounded-lg p-6 border-2 border-purple-500">
                                <div class="text-purple-100 whitespace-pre-line leading-relaxed markdown-body">
                                    ${parseMarkdown(section.content)}
                                </div>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // Simple Markdown parser to handle bold text and tables in the content
        function parseMarkdown(text) {
            let html = text
                // Handle Bold **text**
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                // Handle bullet points
                .replace(/• (.*?)(?:\n|$)/g, '<li class="ml-4 list-disc">$1</li>')
                // Handle Table (Very basic implementation for the Level table)
                .replace(/\| (.*?) \|/g, (match, content) => {
                    const cells = content.split('|').map(cell => `<td class="p-2 border border-purple-500/50">${cell.trim()}</td>`).join('');
                    return `<tr>${cells}</tr>`;
                });

            // Wrap table rows in table tags if table syntax exists
            if (html.includes('<tr>')) {
                html = html.replace(/((?:<tr>.*?<\/tr>\s*)+)/g, '<table class="w-full text-sm my-4 border-collapse">$1</table>');
                // Fix header row style
                html = html.replace(/<tr>(.*?)<\/tr>/, '<tr class="bg-purple-800/50 font-bold">$1</tr>');
            }
            
            return html;
        }

        // Initialize
        renderSections();
    </script>
</body>
</html>
