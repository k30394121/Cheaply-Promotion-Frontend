<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Cheap Tycoon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // ✅ 防止已登入用戶回到重設密碼頁
        (function() {
            const user = localStorage.getItem('currentUser');
            if (user) { window.location.replace('wheel.html'); }
        })();
    </script>
    <style>
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .input-error { border-color: #ef4444 !important; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.3) !important; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .animate-shake { animation: shake 0.3s ease-in-out; }
        @keyframes modal-pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-modal { animation: modal-pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .req-valid { color: #4ade80 !important; }
        .req-invalid { color: #f87171 !important; }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-900 via-purple-800 to-pink-900 min-h-screen font-sans overflow-hidden">
    
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute w-96 h-96 bg-pink-500 rounded-full blur-3xl opacity-20 -top-48 -left-48 animate-pulse"></div>
        <div class="absolute w-96 h-96 bg-purple-500 rounded-full blur-3xl opacity-20 -bottom-48 -right-48 animate-pulse"></div>
        <div id="particles" class="absolute inset-0"></div>
    </div>

    <div class="relative z-10 flex flex-col items-center justify-center min-h-screen px-4 py-8">
        <a href="login.html" class="absolute top-6 left-6 text-purple-200 hover:text-white transition-colors flex items-center gap-2 z-20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            <span class="hidden md:inline">Back to Login</span>
        </a>

        <div class="w-full max-w-md bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl p-8 shadow-2xl relative my-4">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-500/20 mb-4 shadow-lg border border-blue-400/30">
                    <svg class="w-8 h-8 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11.54 12a1 1 0 00-.707-.293h-2.414a1 1 0 01-.707-.293l-1.414-1.414a1 1 0 01.03-1.414l.97-.97a1 1 0 01.732-.273l.975.293a1 1 0 00.95-.293L16 8.586a1 1 0 000-1.414l-1.414-1.414A2 2 0 0115 7z"></path></svg>
                </div>
                <h2 class="text-3xl font-bold text-white mb-1">Reset Password</h2>
                <p class="text-purple-200 text-sm">Enter your email to receive a recovery code</p>
            </div>

            <form id="forgotForm" class="space-y-6">
                <div class="group">
                    <label class="block text-purple-200 text-sm font-medium mb-1 ml-1">Email Address</label>
                    <div class="relative">
                        <input type="email" id="email" class="w-full bg-purple-900/50 border border-purple-500/30 rounded-xl px-4 py-3 pl-11 text-white placeholder-purple-400 focus:outline-none focus:border-blue-400 transition-all duration-300" placeholder="name@example.com">
                        <svg class="w-5 h-5 text-purple-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </div>
                </div>
                <div id="errorMsg" class="hidden text-red-400 text-sm font-bold text-center bg-red-900/20 py-2 rounded-lg border border-red-500/30"></div>
                <button type="submit" class="w-full py-4 bg-gradient-to-r from-blue-500 to-cyan-500 text-white font-bold rounded-xl shadow-lg hover:scale-[1.02] transition-all duration-300">
                    Send Recovery Code
                </button>
            </form>
        </div>
    </div>

    <div id="resetModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-blue-500/50 rounded-3xl p-8 max-w-sm w-full text-center relative animate-modal shadow-2xl">
            <h2 class="text-2xl font-bold text-white mb-2" id="modalTitle">Verification</h2>
            <p class="text-slate-300 text-sm mb-6" id="modalDesc">
                Code sent to <span id="displayEmail" class="text-blue-400 font-mono"></span><br>
                <span class="text-xs text-slate-500">(Check server console)</span>
            </p>
            
            <div id="stage1-verify">
                <input type="text" id="verifyCode" maxlength="6" class="w-full bg-black/50 border border-slate-600 rounded-xl px-4 py-4 mb-6 text-center text-2xl font-mono text-white tracking-[0.5em] focus:border-blue-400 outline-none" placeholder="000000">
                <button onclick="checkCode()" id="checkCodeBtn" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:scale-105 transition-transform">VERIFY CODE</button>
            </div>

            <div id="stage2-reset" class="hidden space-y-4 text-left">
                <div>
                    <input type="password" id="newPassword" class="w-full bg-black/50 border border-slate-600 rounded-xl px-4 py-3 text-white focus:border-blue-400 outline-none" placeholder="New Password">
                    <div class="mt-2 space-y-1 pl-1">
                        <div id="rule-length" class="flex items-center gap-2 text-xs text-slate-500">
                            <span class="icon-container w-4 h-4 flex items-center justify-center">
                                <svg class="w-2 h-2 fill-current icon-default" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4"/></svg>
                                <svg class="w-4 h-4 text-green-400 hidden icon-check" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                <svg class="w-4 h-4 text-red-400 hidden icon-cross" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </span>
                            <span>At least 8 characters</span>
                        </div>
                        <div id="rule-alphanum" class="flex items-center gap-2 text-xs text-slate-500">
                            <span class="icon-container w-4 h-4 flex items-center justify-center">
                                <svg class="w-2 h-2 fill-current icon-default" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4"/></svg>
                                <svg class="w-4 h-4 text-green-400 hidden icon-check" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                <svg class="w-4 h-4 text-red-400 hidden icon-cross" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </span>
                            <span>Letters & numbers</span>
                        </div>
                    </div>
                </div>
                <input type="password" id="confirmPassword" class="w-full bg-black/50 border border-slate-600 rounded-xl px-4 py-3 text-white focus:border-blue-400 outline-none" placeholder="Confirm Password">
                <button onclick="finalReset()" id="resetBtn" class="w-full py-3 bg-gradient-to-r from-blue-500 to-cyan-500 text-white font-bold rounded-xl shadow-lg hover:scale-105 transition-transform">CHANGE PASSWORD</button>
            </div>
            <button onclick="closeModal()" class="mt-4 text-slate-500 text-sm hover:text-white transition-colors">Cancel</button>
        </div>
    </div>

    <script src="js/forgot.js"></script>
</body>
</html>
