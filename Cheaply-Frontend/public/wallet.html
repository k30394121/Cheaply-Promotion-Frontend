<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cheap Tycoon - Link Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自定義動畫樣式 */
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-enter { animation: fade-in-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }
        .shake-animation { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }

        .wallet-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen flex items-center justify-center p-4 overflow-hidden relative">

    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute top-0 left-0 w-full h-full bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 brightness-100 contrast-150"></div>
        <div class="absolute top-1/4 left-1/4 w-64 h-64 md:w-96 md:h-96 bg-purple-600/30 rounded-full blur-[80px] md:blur-[100px] animate-pulse"></div>
        <div class="absolute bottom-1/4 right-1/4 w-64 h-64 md:w-96 md:h-96 bg-blue-600/20 rounded-full blur-[80px] md:blur-[100px]"></div>
    </div>

    <div class="relative z-10 w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl shadow-2xl overflow-hidden animate-enter">
        
        <div class="relative bg-slate-900/50 p-6 md:p-8 text-center border-b border-white/10">
            <button onclick="history.back()" class="absolute left-4 top-6 md:left-6 md:top-8 text-white/50 hover:text-white transition-colors p-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </button>
            <div class="w-14 h-14 md:w-16 md:h-16 bg-gradient-to-tr from-yellow-400 to-orange-500 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-3 md:mb-4">
                <svg class="w-7 h-7 md:w-8 md:h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
            </div>
            <h1 class="text-xl md:text-2xl font-bold text-white tracking-tight">Connect Wallet</h1>
            <p class="text-slate-400 text-xs md:text-sm mt-1 md:mt-2 px-4 md:px-0">Link your Web3 wallet to store assets securely.</p>
        </div>

        <div class="p-5 md:p-8">
            <div class="space-y-3 md:space-y-4">
                
                <button onclick="connectWallet('phantom')" class="wallet-btn group relative w-full flex items-center justify-between p-3 md:p-4 bg-slate-800 hover:bg-slate-700 border border-purple-500/20 hover:border-purple-500/50 rounded-xl transition-all duration-300">
                    <div class="flex items-center gap-3 md:gap-4">
                        <div class="w-10 h-10 bg-[#AB9FF2]/20 rounded-lg flex items-center justify-center p-2 shrink-0">
                            <svg class="w-full h-full text-[#AB9FF2]" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                        </div>
                        <div class="text-left">
                            <h3 class="font-bold text-sm md:text-base text-white group-hover:text-[#AB9FF2] transition-colors">Phantom</h3>
                            <p class="text-[10px] md:text-xs text-slate-400">Solana Network</p>
                        </div>
                    </div>
                    <div class="w-6 h-6 md:w-8 md:h-8 rounded-full border border-white/10 flex items-center justify-center group-hover:bg-purple-500 group-hover:border-purple-500 transition-all shrink-0">
                        <svg class="w-3 h-3 md:w-4 md:h-4 text-white opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </button>

                <button onclick="connectWallet('metamask')" class="wallet-btn group relative w-full flex items-center justify-between p-3 md:p-4 bg-slate-800 hover:bg-slate-700 border border-orange-500/20 hover:border-orange-500/50 rounded-xl transition-all duration-300">
                    <div class="flex items-center gap-3 md:gap-4">
                        <div class="w-10 h-10 bg-[#F6851B]/20 rounded-lg flex items-center justify-center p-2 shrink-0">
                            <svg class="w-full h-full text-[#F6851B]" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                        </div>
                        <div class="text-left">
                            <h3 class="font-bold text-sm md:text-base text-white group-hover:text-[#F6851B] transition-colors">MetaMask</h3>
                            <p class="text-[10px] md:text-xs text-slate-400">Ethereum Network</p>
                        </div>
                    </div>
                    <div class="w-6 h-6 md:w-8 md:h-8 rounded-full border border-white/10 flex items-center justify-center group-hover:bg-orange-500 group-hover:border-orange-500 transition-all shrink-0">
                        <svg class="w-3 h-3 md:w-4 md:h-4 text-white opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </button>

            </div>

            <div id="statusMsg" class="hidden mt-4"></div>
        </div>

        <div class="bg-slate-900/80 p-3 md:p-4 text-center border-t border-white/5">
            <p class="text-[10px] md:text-xs text-slate-500">By connecting, you agree to our <a href="#" class="text-purple-400 hover:underline">Terms of Service</a>.</p>
        </div>
    </div>

    <script src="js/wallet.js"></script>
</body>
</html>
