<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Register - Cheap Tycoon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        .toggle-checkbox:checked { transform: translateX(100%); border-color: #fbbf24; }
        .toggle-checkbox:checked + .toggle-label { background-color: #fbbf24; }
        .toggle-checkbox { transition: all 0.3s ease-in-out; }

        .no-scrollbar::-webkit-scrollbar { width: 0px; background: transparent; }

        /* Error Styles */
        .input-error {
            border-color: #ef4444 !important;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.3) !important;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.3s ease-in-out; }

        .req-valid { color: #4ade80 !important; }
        .req-invalid { color: #f87171 !important; }
        
        .error-message {
            color: #ef4444; font-size: 0.75rem; font-weight: 700; margin-top: 0.25rem;
            display: none; align-items: center; gap: 0.25rem; margin-left: 0.25rem;
        }
        .error-message.show { display: flex; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Fixes */
        .no-tap-highlight { -webkit-tap-highlight-color: transparent; }
        button:active { transform: scale(0.96); }
        
        /* Ensure inputs look consistent on iOS */
        input:not([type="checkbox"]) { -webkit-appearance: none; }
        
        /* Prevent body jumping when keyboard opens */
        body { overscroll-behavior-y: contain; }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-900 via-purple-800 to-pink-900 min-h-screen font-sans text-white">
    
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute w-64 h-64 md:w-96 md:h-96 bg-pink-500 rounded-full blur-3xl opacity-20 -top-24 -left-24 animate-pulse"></div>
        <div class="absolute w-64 h-64 md:w-96 md:h-96 bg-purple-500 rounded-full blur-3xl opacity-20 -bottom-24 -right-24 animate-pulse"></div>
        <!-- FIX 4: 移除此處的粒子內嵌 script，統一交給 signup.js 的 initParticles() 處理，避免重複初始化 -->
        <div id="particles" class="absolute inset-0"></div>
    </div>

    <div class="relative z-10 flex flex-col items-center justify-center min-h-screen px-4 py-8 md:py-12">
        
        <button onclick="history.back()" class="absolute top-4 left-4 md:top-6 md:left-6 text-purple-200 hover:text-white transition-all flex items-center gap-2 no-tap-highlight active:scale-90 z-20">
            <div class="p-2 rounded-full bg-white/10 border border-white/10 shadow-lg">
                <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
            </div>
            <span class="text-[10px] md:text-xs font-bold uppercase tracking-widest hidden sm:inline">Back</span>
        </button>

        <div class="w-full max-w-lg bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl md:rounded-[2.5rem] p-5 sm:p-8 md:p-10 shadow-2xl relative fade-in" style="animation: fadeIn 0.8s 0.2s forwards; opacity: 0;">
            <div class="absolute top-0 right-0 w-24 h-24 md:w-32 md:h-32 bg-yellow-400 rounded-full blur-3xl opacity-10 -mr-10 -mt-10"></div>
            
            <div class="text-center mb-6 md:mb-8">
                <h2 class="text-2xl md:text-3xl font-black uppercase italic tracking-tighter text-white">Create Account</h2>
                <p class="text-purple-300 text-[10px] md:text-xs font-bold uppercase tracking-widest mt-1">Start your fortune today</p>
            </div>

            <form id="registerForm" class="space-y-3 md:space-y-4" novalidate>
                
                <div class="space-y-1 md:space-y-1.5">
                    <label class="block text-purple-200 text-[9px] md:text-[10px] font-black uppercase tracking-[0.2em] ml-1">Email Address</label>
                    <div class="relative">
                        <input type="email" id="email" class="w-full bg-black/30 border border-white/10 rounded-xl px-3 py-3 md:px-4 md:py-4 pl-10 md:pl-12 text-sm md:text-base text-white placeholder-purple-400/50 focus:outline-none focus:border-yellow-400 transition-all no-tap-highlight" placeholder="tycoon@example.com">
                        <svg class="w-4 h-4 md:w-5 md:h-5 text-purple-400/50 absolute left-3 md:left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </div>
                    <!-- FIX 1: 補上 emailErrorText 子元素，讓 showServerError() 可以填入錯誤文字 -->
                    <p id="emailError" class="error-message"><span id="emailErrorText"></span></p>
                </div>

                <div class="space-y-1 md:space-y-1.5">
                    <label class="block text-purple-200 text-[9px] md:text-[10px] font-black uppercase tracking-[0.2em] ml-1">Username</label>
                    <div class="relative">
                        <input type="text" id="fullName" class="w-full bg-black/30 border border-white/10 rounded-xl px-3 py-3 md:px-4 md:py-4 pl-10 md:pl-12 text-sm md:text-base text-white placeholder-purple-400/50 focus:outline-none focus:border-yellow-400 transition-all no-tap-highlight" placeholder="Your Tycoon Name">
                        <svg class="w-4 h-4 md:w-5 md:h-5 text-purple-400/50 absolute left-3 md:left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                    <!-- FIX 1: 補上 fullNameErrorText 子元素 -->
                    <p id="fullNameError" class="error-message"><span id="fullNameErrorText"></span></p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
                    <div class="space-y-1 md:space-y-1.5">
                        <label class="block text-purple-200 text-[9px] md:text-[10px] font-black uppercase tracking-[0.2em] ml-1">Password</label>
                        <div class="relative">
                            <input type="password" id="password" class="w-full bg-black/30 border border-white/10 rounded-xl px-3 py-3 md:px-4 md:py-4 pl-10 md:pl-12 text-sm md:text-base text-white placeholder-purple-400/50 focus:outline-none focus:border-yellow-400 transition-all no-tap-highlight" placeholder="••••••••">
                            <svg class="w-4 h-4 md:w-5 md:h-5 text-purple-400/50 absolute left-3 md:left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </div>
                    </div>

                    <div class="space-y-1 md:space-y-1.5">
                        <label class="block text-purple-200 text-[9px] md:text-[10px] font-black uppercase tracking-[0.2em] ml-1">Confirm</label>
                        <div class="relative">
                            <input type="password" id="confirmPassword" class="w-full bg-black/30 border border-white/10 rounded-xl px-3 py-3 md:px-4 md:py-4 pl-10 md:pl-12 text-sm md:text-base text-white placeholder-purple-400/50 focus:outline-none focus:border-yellow-400 transition-all no-tap-highlight" placeholder="••••••••">
                            <svg class="w-4 h-4 md:w-5 md:h-5 text-purple-400/50 absolute left-3 md:left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                    </div>
                </div>

                <div class="flex flex-wrap gap-x-3 gap-y-1.5 mt-1 px-1">
                    <div id="rule-length" class="flex items-center gap-1.5 md:gap-2 text-[9px] md:text-[10px] font-bold uppercase tracking-wider text-purple-400">
                        <div class="icon-container w-3 h-3 flex items-center justify-center">
                            <svg class="w-full h-full fill-current icon-default" viewBox="0 0 8 8"><circle cx="4" cy="4" r="3"/></svg>
                            <svg class="w-3 h-3 md:w-3.5 md:h-3.5 text-green-400 hidden icon-check" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            <svg class="w-3 h-3 md:w-3.5 md:h-3.5 text-red-400 hidden icon-cross" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </div>
                        <span>8+ Characters</span>
                    </div>
                    <div id="rule-alphanum" class="flex items-center gap-1.5 md:gap-2 text-[9px] md:text-[10px] font-bold uppercase tracking-wider text-purple-400">
                        <div class="icon-container w-3 h-3 flex items-center justify-center">
                            <svg class="w-full h-full fill-current icon-default" viewBox="0 0 8 8"><circle cx="4" cy="4" r="3"/></svg>
                            <svg class="w-3 h-3 md:w-3.5 md:h-3.5 text-green-400 hidden icon-check" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            <svg class="w-3 h-3 md:w-3.5 md:h-3.5 text-red-400 hidden icon-cross" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </div>
                        <span>A-Z & 0-9</span>
                    </div>
                </div>

                <div class="space-y-1 md:space-y-1.5 pt-1 md:pt-2">
                    <label class="flex justify-between text-purple-200 text-[9px] md:text-[10px] font-black uppercase tracking-[0.2em] ml-1">
                        <span>Solana Wallet <span class="text-purple-400/50 italic">(Optional)</span></span>
                    </label>
                    <div class="relative flex">
                        <input type="text" id="walletInput" class="w-full bg-black/30 border border-white/10 rounded-xl px-3 py-3 md:px-4 md:py-4 pl-10 md:pl-12 pr-20 md:pr-24 text-sm md:text-base text-white placeholder-purple-400/50 focus:outline-none focus:border-yellow-400 transition-all no-tap-highlight truncate" placeholder="Phantom Address">
                        <svg class="w-4 h-4 md:w-5 md:h-5 text-purple-400/50 absolute left-3 md:left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                        <button type="button" onclick="connectPhantom()" class="absolute right-1.5 top-1.5 bottom-1.5 md:right-2 md:top-2 md:bottom-2 px-3 md:px-4 bg-purple-600 hover:bg-purple-500 text-[9px] md:text-[10px] font-black uppercase text-white rounded-lg transition-all no-tap-highlight border border-white/10">Connect</button>
                    </div>
                </div>

                <div class="space-y-1 md:space-y-1.5">
                    <label class="block text-purple-200 text-[9px] md:text-[10px] font-black uppercase tracking-[0.2em] ml-1">Invite Code <span class="text-purple-400/50 italic">(Optional)</span></label>
                    <div class="relative">
                        <input type="text" id="inviteCode" class="w-full bg-black/30 border border-white/10 rounded-xl px-3 py-3 md:px-4 md:py-4 pl-10 md:pl-12 text-sm md:text-base text-white placeholder-purple-400/50 focus:outline-none focus:border-yellow-400 transition-all no-tap-highlight uppercase" placeholder="Referral Code">
                        <svg class="w-4 h-4 md:w-5 md:h-5 text-purple-400/50 absolute left-3 md:left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path></svg>
                    </div>
                    <!-- FIX 2: 補上 inviteCodeErrorText 子元素 -->
                    <p id="inviteCodeError" class="error-message"><span id="inviteCodeErrorText"></span></p>
                </div>

                <div class="bg-black/30 rounded-xl md:rounded-2xl p-3 md:p-4 border border-white/5 flex items-center justify-between no-tap-highlight cursor-pointer" onclick="document.getElementById('it_bg').click()">
                    <div class="flex items-center gap-2 md:gap-3">
                        <div class="w-8 h-8 md:w-10 md:h-10 bg-purple-800/40 rounded-lg md:rounded-xl flex items-center justify-center text-yellow-400 border border-purple-500/20">
                            <i class="fa-solid fa-code"></i>
                        </div>
                        <div>
                            <p class="text-white text-[11px] md:text-xs font-black uppercase italic leading-none">IT Background</p>
                            <p class="text-gray-500 text-[8px] md:text-[9px] font-bold uppercase mt-1">Are you a Developer?</p>
                        </div>
                    </div>
                    <div class="relative inline-block w-10 md:w-12 align-middle select-none">
                        <input type="checkbox" name="it_bg" id="it_bg" class="toggle-checkbox absolute block w-5 h-5 md:w-6 md:h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-purple-900 top-0 left-0" onclick="event.stopPropagation()"/>
                        <label for="it_bg" class="toggle-label block overflow-hidden h-5 md:h-6 rounded-full bg-purple-900 cursor-pointer border border-white/10"></label>
                    </div>
                </div>

                <label id="termsRow" class="flex items-start gap-3 md:gap-4 px-1 group no-tap-highlight cursor-pointer rounded-lg transition-colors">
                    <div class="flex items-center h-5 md:h-6">
                        <input id="terms" type="checkbox" class="w-4 h-4 md:w-5 md:h-5 border-2 border-purple-500 rounded md:rounded-lg bg-black/40 text-yellow-400 focus:ring-0 cursor-pointer mt-0.5 transition-colors accent-yellow-400" style="-webkit-appearance: auto; appearance: auto;">
                    </div>
                    <span id="termsLabel" class="inline-block text-[9px] md:text-[11px] font-bold text-purple-300 leading-tight cursor-pointer uppercase tracking-tight transition-colors">
                        I agree to the <a href="ToS.pdf" target="_blank" class="text-yellow-400 hover:underline" onclick="event.stopPropagation()">Terms of Service</a> & Privacy Policy
                    </span>
                </label>

                <button type="submit" id="registerBtn" class="w-full py-4 md:py-5 bg-gradient-to-r from-yellow-400 to-orange-500 text-purple-950 text-sm md:text-base font-black rounded-xl md:rounded-2xl shadow-xl active:scale-95 transition-all uppercase tracking-widest mt-4 md:mt-6 no-tap-highlight">
                    Create Account
                </button>

            </form>
        </div>
    </div>

    <div id="toast-notification" class="fixed top-4 right-4 md:top-6 md:right-6 z-[60] transform translate-x-full transition-transform duration-300 pointer-events-none w-[85%] md:w-full max-w-sm">
        <div class="bg-slate-900/95 backdrop-blur border-l-4 border-purple-500 text-white px-4 py-3 md:px-6 md:py-4 rounded-xl shadow-2xl flex items-center gap-3 md:gap-4">
            <div id="toast-icon" class="text-xl md:text-2xl">🔔</div>
            <div>
                <h4 id="toast-title" class="font-black text-[9px] md:text-[10px] text-purple-400 uppercase tracking-widest">Notification</h4>
                <p id="toast-message" class="text-[11px] md:text-xs text-gray-300 mt-0.5">Message...</p>
            </div>
        </div>
    </div>

    <!-- FIX 4: 移除原本內嵌的粒子 script，改由 signup.js 的 initParticles() 統一處理 -->
    <script src="js/signup.js"></script>
</body>
</html>
